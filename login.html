<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>NEXT DREAM — Entrar</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --preto: #050505;
      --preto2: #0b0b0b;
      --verde: #a6ff00;
      --branco: #f5f5f5;
      --cinza: #888;
    }

    body {
      min-height: 100vh;

      background: var(--preto);

      color: var(--branco);

      font-family: Arial, Helvetica, sans-serif;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 430px;

      background: var(--preto2);

      border: 1px solid #202020;

      padding: 45px 35px;
    }

    .logo {
      display: block;

      text-align: center;

      color: var(--branco);

      text-decoration: none;

      font-size: 25px;

      font-weight: 900;

      letter-spacing: 2px;

      margin-bottom: 45px;
    }

    .logo span {
      color: var(--verde);
    }

    .logo b {
      color: var(--verde);
    }

    .login-title {
      text-align: center;

      font-size: 28px;

      font-weight: 900;

      margin-bottom: 10px;
    }

    .login-subtitle {
      text-align: center;

      color: var(--cinza);

      font-size: 13px;

      margin-bottom: 35px;
    }

    .campo {
      margin-bottom: 20px;
    }

    .campo label {
      display: block;

      color: #aaa;

      font-size: 11px;

      font-weight: 800;

      letter-spacing: 1px;

      margin-bottom: 8px;
    }

    .campo input {
      width: 100%;

      padding: 14px;

      background: #050505;

      border: 1px solid #303030;

      color: #fff;

      outline: none;

      font-size: 14px;
    }

    .campo input:focus {
      border-color: var(--verde);
    }

    .btn-login {
      width: 100%;

      border: 0;

      background: var(--verde);

      color: #000;

      padding: 15px;

      cursor: pointer;

      font-size: 12px;

      font-weight: 900;

      letter-spacing: 1px;

      margin-top: 5px;
    }

    .btn-login:hover {
      background: #baff33;
    }

    .login-links {
      display: flex;

      justify-content: space-between;

      gap: 10px;

      margin-top: 22px;
    }

    .login-links a {
      color: #777;

      text-decoration: none;

      font-size: 10px;

      font-weight: 700;
    }

    .login-links a:hover {
      color: var(--verde);
    }

    .voltar {
      display: block;

      text-align: center;

      margin-top: 35px;

      color: #777;

      text-decoration: none;

      font-size: 11px;

      font-weight: 700;
    }

    .voltar:hover {
      color: var(--verde);
    }

  </style>

</head>


<body>

  <div class="login-container">

    <a href="index.html" class="logo">
      <span>N</span> NEXT <b>DREAM</b>
    </a>


    <h1 class="login-title">
      ENTRAR
    </h1>

    <p class="login-subtitle">
      Acesse sua conta NEXT DREAM
    </p>


    <form id="loginForm">

      <div class="campo">

        <label for="email">
          E-MAIL
        </label>

        <input
          type="email"
          id="email"
          placeholder="seu@email.com"
          required>

      </div>


      <div class="campo">

        <label for="senha">
          SENHA
        </label>

        <input
          type="password"
          id="senha"
          placeholder="Sua senha"
          required>

      </div>


      <button
        type="submit"
        class="btn-login">

        ENTRAR →

      </button>

    </form>


    <div class="login-links">

      <a href="#">
        ESQUECI MINHA SENHA
      </a>

      <a href="#">
        CRIAR CONTA
      </a>

    </div>


    <a href="index.html" class="voltar">
      ← VOLTAR PARA A NEXT DREAM
    </a>

  </div>


  <script>

    document
      .getElementById("loginForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        alert(
          "O sistema de login será conectado ao Supabase na próxima etapa."
        );

      });

  </script>

</body>

</html>
