<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NEXT DREAM — Entrar</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --preto: #050505;
      --verde: #a6ff00;
      --branco: #f5f5f5;
      --cinza: #777;
    }

    body {
      min-height: 100vh;

      background: var(--preto);
      color: var(--branco);

      font-family: Arial, Helvetica, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      display: block;

      text-align: center;

      color: white;
      text-decoration: none;

      font-size: 30px;
      font-weight: 900;

      letter-spacing: 3px;

      margin-bottom: 40px;
    }

    .logo span,
    .logo b {
      color: var(--verde);
    }

    .login-box {
      background: #0b0b0b;

      border: 1px solid #1c1c1c;

      padding: 35px;
    }

    .login-box small {
      display: block;

      color: var(--verde);

      font-size: 10px;
      font-weight: 800;

      letter-spacing: 3px;

      margin-bottom: 10px;
    }

    .login-box h1 {
      font-size: 30px;

      margin-bottom: 30px;
    }

    .campo {
      margin-bottom: 18px;
    }

    .campo label {
      display: block;

      color: #aaa;

      font-size: 11px;
      font-weight: 700;

      margin-bottom: 8px;
    }

    .campo input {
      width: 100%;

      padding: 14px;

      background: #050505;

      border: 1px solid #292929;

      color: white;

      outline: none;

      font-size: 14px;
    }

    .campo input:focus {
      border-color: var(--verde);
    }

    .btn-login {
      width: 100%;

      padding: 15px;

      margin-top: 5px;

      background: var(--verde);

      color: #000;

      border: 0;

      cursor: pointer;

      font-size: 12px;
      font-weight: 900;

      letter-spacing: 1px;
    }

    .btn-login:hover {
      background: #baff33;
    }

    .links {
      display: flex;

      justify-content: space-between;

      margin-top: 20px;

      gap: 15px;
    }

    .links a {
      color: #777;

      text-decoration: none;

      font-size: 10px;
    }

    .links a:hover {
      color: var(--verde);
    }

    .voltar {
      display: block;

      text-align: center;

      margin-top: 25px;

      color: #666;

      text-decoration: none;

      font-size: 10px;
    }

    .voltar:hover {
      color: var(--verde);
    }

    @media (max-width: 500px) {

      .login-box {
        padding: 25px 20px;
      }

    }

  </style>

</head>

<body>

  <div class="login-container">

    <a href="index.html" class="logo">
      <span>N</span>EXT <b>DREAM</b>
    </a>

    <div class="login-box">

      <small>ACESSO</small>

      <h1>Entrar</h1>

      <form id="loginForm">

        <div class="campo">

          <label for="email">
            E-MAIL
          </label>

          <input
            type="email"
            id="email"
            placeholder="seu@email.com"
            required
          >

        </div>


        <div class="campo">

          <label for="senha">
            SENHA
          </label>

          <input
            type="password"
            id="senha"
            placeholder="Sua senha"
            required
          >

        </div>


        <button
          type="submit"
          class="btn-login"
        >
          ENTRAR →
        </button>

      </form>


      <div class="links">

        <a href="#">
          ESQUECI MINHA SENHA
        </a>

        <a href="#">
          CRIAR CONTA
        </a>

      </div>

    </div>


    <a href="index.html" class="voltar">
      ← VOLTAR PARA A NEXT DREAM
    </a>

  </div>


  <script>

    document
      .getElementById("loginForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        alert(
          "O sistema de login será conectado ao Supabase na próxima etapa."
        );

      });

  </script>

</body>

</html>
